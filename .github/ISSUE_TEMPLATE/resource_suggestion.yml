name: Resource suggestion
description: Suggest a resource to add, update, or flag as stale in resources/curated-resources.md
labels: ["resources"]
body:
  - type: markdown
    attributes:
      value: |
        This repo curates resources honestly, including saying when something has aged.
        See `resources/curated-resources.md` for the format each entry follows.
  - type: input
    id: url
    attributes:
      label: URL
      description: Link to the resource.
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: What are you suggesting?
      options:
        - Add a new resource
        - Update an existing entry (date, aged status, etc.)
        - Flag an existing entry as dead or wrong
        - Fix a broken link
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What does this cover well, when was it made, and is it still current? If you're flagging something as outdated, say why - and if you know which kernel/liburing version it's now out of step with, say that too.
    validations:
      required: true
